<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a07">
  <title>Backrooms - FPS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="view"></div>

  <section id="boot" class="screen active">
    <div class="fluoro"></div>
    <div class="boot-center">
      <div class="logo" data-text="BACKROOMS">BACKROOMS</div>
      <div class="logo-sub" id="boot-sub">LEVEL 0 &nbsp;//&nbsp; TACTICAL OPERATIONS</div>
      <div class="loadbar"><div class="loadbar-fill" id="boot-fill"></div></div>
      <div class="boot-status" id="boot-status">INITIALIZING</div>
      <button class="boot-enter hidden" id="boot-enter">ENTER</button>
    </div>
    <div class="boot-tip" id="boot-tip"></div>
  </section>

  <div id="ui"></div>

  <script src="game.js"></script>
</body>
</html>
