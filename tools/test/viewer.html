<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}</style></head><body>
<script src="../../Backrooms FPS/lib/three/three.min.js"></script>
<script src="../../Backrooms FPS/lib/three/GLTFLoader.js"></script>
<script src="../../Backrooms FPS/lib/three/SkeletonUtils.js"></script>
<script>
const r=new THREE.WebGLRenderer({antialias:true});r.setSize(1024,768);document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color(0x202020);
s.add(new THREE.HemisphereLight(0xfff3c0,0x554422,2.5));
const cam=new THREE.PerspectiveCamera(70,1024/768,0.05,200);
window.view=(px,py,pz,tx,ty,tz,fov=70)=>{cam.fov=fov;cam.updateProjectionMatrix();cam.position.set(px,py,pz);cam.lookAt(tx,ty,tz);r.render(s,cam);};
const L=new THREE.GLTFLoader();
window.load=(url,opts={})=>new Promise(res=>L.load(url,g=>{
  if(opts.basic) g.scene.traverse(o=>{if(o.isMesh){const m=o.material;o.material=new THREE.MeshBasicMaterial({map:m.emissiveMap,color:m.emissiveMap?0xffffff:m.emissive,side:THREE.DoubleSide});}});
  if(opts.hideCeil) g.scene.traverse(o=>{if(o.isMesh){}});
  s.add(g.scene);window.last=g;res(g.animations.map(a=>a.name));}));
</script></body></html>
